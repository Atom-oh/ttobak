[package]
name = "ttobak-mac"
version = "0.1.0"
description = "TTOBAK Mac App — system audio and microphone capture for desktop meetings"
authors = ["TTOBAK"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ttobak_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "time", "net", "io-util"] }
# Local notification when MCP starts a recording (control.rs); Rust-side only.
tauri-plugin-notification = "2"
parking_lot = "0.12"
hound = "3.5"
base64 = "0.22"

# Streaming upload of the recorded WAV straight to a presigned S3 URL — see
# `src/upload.rs`. Bulk audio bytes must never cross the Tauri IPC bridge to
# the WebView again (the whole point of this module's `upload_recording`
# command), so the HTTP client lives here, not in the frontend.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# macOS-only audio capture (Core Audio process tap + microphone aggregate
# device, macOS 14.2+) and IOKit idle-sleep protection.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSUUID", "NSValue"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString", "CFDictionary", "CFArray", "CFNumber", "CFBase"] }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "block2", "objc2", "objc2-foundation", "objc2-core-audio-types", "AudioHardware"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std", "CoreAudioBaseTypes"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
