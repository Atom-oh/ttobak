<style>
  .up { font-family: var(--font-anthropic-sans); display: grid; gap: var(--cds-gap-lg); }
  .up-title { font-family: var(--font-anthropic-sans); font-weight: 700; letter-spacing: -.03em; font-size: var(--cds-font-size-title); line-height: 1.25; margin: 0; text-wrap: balance; }
  .up-sub, .up-note { margin: 0; color: var(--color-fg-muted); font-size: var(--cds-font-size-body); max-width: 70ch; }
  .up-note { font-size: var(--cds-font-size-caption); }
  .up-cols { display: grid; gap: var(--cds-gap-lg); grid-template-columns: repeat(auto-fit, minmax(min(100%, 24rem), 1fr)); align-items: start; }
  .up-card { background: var(--color-panel); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); padding: var(--cds-pad-lg); display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--cds-gap-md); min-width: 0; }
  .up-card h2 { margin: 0; font-size: var(--cds-font-size-heading); font-weight: var(--cds-font-weight-medium); }
  .up-tree { display: grid; gap: var(--cds-gap-xs); }
  .up-acct { font: inherit; font-size: var(--cds-font-size-body); text-align: left; display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: baseline; justify-content: space-between; padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); color: var(--color-fg); cursor: pointer; width: 100%; box-sizing: border-box; }
  .up-acct[aria-pressed="true"] { border-color: var(--color-fg); box-shadow: inset 0 0 0 1px var(--color-fg); }
  .up-acct:disabled { cursor: default; color: var(--color-fg-muted); background: transparent; border-style: dashed; }
  .up-acct small { color: var(--color-fg-muted); font-size: var(--cds-font-size-caption); }
  .up-child { margin-left: var(--cds-gap-lg); }
  .up-row { display: flex; flex-wrap: wrap; gap: var(--cds-gap-sm); align-items: center; }
  .up input[type="text"] { font: inherit; font-size: var(--cds-font-size-input); padding: var(--cds-pad-sm) var(--cds-pad-md); border: 1px solid var(--color-border-line); border-radius: var(--cds-radius); background: var(--color-bg); color: var(--color-fg); min-width: 0; flex: 1 1 10rem; }
  .up input[type="file"] { font: inherit; font-size: var(--cds-font-size-body); max-width: 100%; }
  .up-btn { font: inherit; font-size: var(--cds-font-size-body); padding: var(--cds-pad-sm) var(--cds-pad-lg); border-radius: var(--cds-radius); border: 1px solid var(--color-fg); background: var(--color-fg); color: var(--color-bg); cursor: pointer; }
  .up-btn.ghost { background: var(--color-panel); color: var(--color-fg); border-color: var(--color-border-line); }
  .up-btn.small { font-size: var(--cds-font-size-caption); padding: var(--cds-pad-xs) var(--cds-pad-sm); }
  .up-btn:disabled { opacity: .5; cursor: default; }
  .up :focus-visible { outline: 2px solid var(--color-fg); outline-offset: 2px; }
  .up-src { display: grid; gap: var(--cds-gap-xs); border: 0; margin: 0; padding: 0; min-width: 0; }
  .up-src label { display: flex; gap: var(--cds-gap-sm); align-items: center; font-size: var(--cds-font-size-body); }
  .up-bar { height: 10px; border-radius: 999px; background: var(--cds-chart-grid); overflow: hidden; }
  .up-bar > div { height: 100%; width: 0; background: var(--series-1); transition: width var(--cds-dur-slow) var(--cds-ease-out); }
  .up-msg { margin: 0; font-size: var(--cds-font-size-caption); min-height: 1.2em; }
  .up-msg.err { color: var(--color-bad); } .up-msg.ok { color: var(--color-ok); }
  .up-tablebox { overflow: auto; }
  .up-table { border-collapse: collapse; width: 100%; font-size: var(--cds-font-size-caption); line-height: var(--cds-line-height-table); font-variant-numeric: lining-nums tabular-nums; letter-spacing: 0; }
  .up-table th, .up-table td { padding: var(--cds-pad-sm); border-bottom: 1px solid var(--color-border-line); text-align: left; vertical-align: top; }
  .up-table th { color: var(--color-fg-muted); font-weight: var(--cds-font-weight-medium); white-space: nowrap; }
  .up-table td.nw { white-space: nowrap; }
  .up-table td.reason { min-width: 12rem; overflow-wrap: anywhere; }
  .up-chips { display: flex; flex-wrap: wrap; gap: 2px; }
  .up-chip { display: inline-block; padding: 0 var(--cds-pad-xs); border-radius: 999px; border: 1px solid var(--color-border-line); font-size: var(--cds-font-size-caption); color: var(--color-fg-muted); white-space: nowrap; }
  .up-chip.done { color: var(--color-ok); border-color: currentColor; }
  .up-chip.running { color: var(--series-1); border-color: currentColor; }
  .up-chip.failed { color: var(--color-bad); border-color: currentColor; }
  .up-chip.needs_review, .up-chip.warn, .up-chip.stale { color: var(--color-warn); border-color: currentColor; }
  .up-status.done { color: var(--color-ok); } .up-status.failed { color: var(--color-bad); } .up-status.needs_review { color: var(--color-warn); } .up-status.discarded { color: var(--color-fg-muted); }
  .up-acts { display: flex; flex-wrap: wrap; gap: var(--cds-gap-xs); }
  .up button, .up input, .up input[type], .up select { line-height: var(--cds-line-height-control); }
</style>
<div class="up" id="up">
  <div>
    <h1 class="up-title">데이터 업로드</h1>
    <p class="up-sub">작업할 TTOBAK account를 고르고 COT 또는 CUR zip을 올리면 분석이 순서대로 진행됩니다.</p>
  </div>
  <div class="up-cols">
    <section class="up-card" aria-labelledby="up-h-acct">
      <h2 id="up-h-acct">1. Account 선택</h2>
      <div class="up-tree" id="up-tree"></div>
      <p class="up-note" id="up-tree-note">업로드 권한이 있는 account만 선택할 수 있습니다. 점선 항목은 상위 account입니다.</p>
      <div class="up-row">
        <input type="text" id="up-known-id" placeholder="account id" aria-label="account id" maxlength="64" autocomplete="off">
        <button type="button" class="up-btn ghost" id="up-known-add">account id로 추가</button>
      </div>
      <p class="up-msg" id="up-known-msg" role="status"></p>
    </section>
    <section class="up-card" aria-labelledby="up-h-form">
      <h2 id="up-h-form">2. 파일 업로드</h2>
      <p class="up-note" id="up-selected">선택된 account가 없습니다.</p>
      <fieldset class="up-src" id="up-src">
        <legend class="up-note">데이터 종류</legend>
        <label><input type="radio" name="up-source" value="cot" id="up-src-cot" checked> COT</label>
        <label><input type="radio" name="up-source" value="cur" id="up-src-cur"> CUR</label>
      </fieldset>
      <p class="up-note" id="up-cap"></p>
      <input type="file" id="up-file" accept=".zip,application/zip" aria-label="zip 파일">
      <div class="up-row">
        <button type="button" class="up-btn" id="up-start" disabled>업로드 시작</button>
        <button type="button" class="up-btn ghost" id="up-discard" hidden>폐기</button>
      </div>
      <div class="up-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="up-progress" hidden><div></div></div>
      <p class="up-msg" id="up-msg" role="status"></p>
    </section>
  </div>
  <section class="up-card" aria-labelledby="up-h-hist">
    <h2 id="up-h-hist">3. 업로드 이력</h2>
    <div class="up-tablebox">
      <table class="up-table" id="up-hist">
        <thead><tr><th>Account</th><th>파일</th><th>업로더</th><th>시간</th><th>기간</th><th>상태</th><th>단계</th><th>사유</th><th>작업</th></tr></thead>
        <tbody id="up-hist-body"></tbody>
      </table>
    </div>
    <p class="up-note" id="up-hist-note">account를 선택하면 이력이 표시됩니다.</p>
    <p class="up-msg" id="up-act-msg" role="status"></p>
  </section>
</div>
<script>
(function () {
  'use strict';
  var LIMITS = { cot: 209715200, cur: 5368709120 };
  var CAP = {
    cot: '월별 서비스·약정·COH·COT360 분석, 태그 추이 없음',
    cur: '태그·리소스·사용유형·일별 추이'
  };
  var STEPS = [['validate', '검증'], ['extract', '추출'], ['datasets', '데이터셋'], ['check', '점검'], ['agents', 'AI 분석'], ['report', '리포트'], ['publish', '게시']];
  var STATUS = { uploading: '업로드 중', queued: '대기', running: '처리 중', done: '완료', needs_review: '검토 필요', failed: '실패', discarded: '폐기됨' };
  var ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
  var LOCKED = '이미 처리 중인 업로드가 있습니다';
  var PARALLEL = 4, RETRIES = 3;
  var $ = function (id) { return document.getElementById(id); };
  var accounts = Array.isArray(window.TB_ACCOUNTS) ? window.TB_ACCOUNTS : [];
  var selected = null;      // account id
  var rows = [];            // history of the selected account
  var uploading = false;    // an upload runs in this tab
  var failedUpload = null;  // {acct, uploadId} offered for discard
  var activeUpload = null;  // uploadId whose parts this tab is sending right now
  var pollTimer = null;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }
  function say(id, text, kind) {
    var e = $(id); e.textContent = text || ''; e.className = 'up-msg' + (kind ? ' ' + kind : '');
  }
  function mb(n) { return (n / 1048576 >= 1024 ? (n / 1073741824).toFixed(0) + ' GB' : (n / 1048576).toFixed(0) + ' MB'); }
  function fmtSize(n) { return typeof n === 'number' ? (n >= 1073741824 ? (n / 1073741824).toFixed(2) + ' GB' : (n / 1048576).toFixed(1) + ' MB') : ''; }
  function fmtTime(s) {
    var d = new Date(s);
    if (isNaN(d.getTime())) return '';
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function fmtPeriod(p) {
    if (!p || typeof p !== 'object') return '';
    var months = Array.isArray(p.months) ? p.months : [];
    var a = p.first || months[0], b = p.last || months[months.length - 1];
    return a && b ? (a === b ? a : a + ' ~ ' + b) : '';
  }
  var base = function (acct) { return '/api/billing/accounts/' + encodeURIComponent(acct); };

  // JSON request with the Bearer token (dash-shim's withAuth); POSTs carry the CSRF header (the browser adds Origin itself)
  async function api(path, method, body) {
    var opt = { method: method || 'GET' };
    if (opt.method === 'POST') {
      opt.headers = { 'Content-Type': 'application/json', 'X-TB': '1' };
      opt.body = JSON.stringify(body || {});
    }
    var res = await window.__billingShim.withAuth(path, opt);
    var data = null;
    try { data = await res.json(); } catch (e) { data = null; }
    return { ok: res.ok, status: res.status, data: data };
  }
  function errText(r, fallback) {
    return r && r.data && typeof r.data.error === 'string' && r.data.error ? r.data.error : fallback;
  }

  // ---------- accounts ----------
  function accountById(id) { return accounts.find(function (a) { return a.id === id; }) || null; }
  function srcLabel(a) {
    var out = [];
    ['cot', 'cur'].forEach(function (s) {
      var x = a.sources && a.sources[s];
      if (x) out.push(s.toUpperCase() + ' ' + (fmtPeriod(x.period) || '현재'));
    });
    return out.length ? out.join(' · ') : '데이터 없음';
  }
  function renderTree() {
    var tree = $('up-tree');
    tree.textContent = '';
    var ids = {};
    accounts.forEach(function (a) { ids[a.id] = true; });
    var kids = {};
    var roots = [];
    accounts.forEach(function (a) {
      if (a.parentId && ids[a.parentId] && a.parentId !== a.id) (kids[a.parentId] = kids[a.parentId] || []).push(a);
      else roots.push(a);
    });
    var seen = {};
    function add(a, depth) {
      if (seen[a.id]) return;
      seen[a.id] = true;
      var b = el('button', 'up-acct' + (depth ? ' up-child' : ''));
      b.type = 'button';
      b.setAttribute('data-id', a.id);
      b.setAttribute('aria-pressed', a.id === selected ? 'true' : 'false');
      b.disabled = !a.canUpload;
      b.appendChild(el('span', '', a.name || a.id));
      b.appendChild(el('small', '', a.canUpload ? srcLabel(a) : '상위 account'));
      b.addEventListener('click', function () { choose(a.id); });
      tree.appendChild(b);
      (kids[a.id] || []).forEach(function (c) { add(c, depth + 1); });
    }
    roots.forEach(function (a) { add(a, 0); });
    accounts.forEach(function (a) { add(a, 0); }); // cycles: still listed
    if (!accounts.length) tree.appendChild(el('p', 'up-note', '표시할 account가 없습니다.'));
  }
  async function loadAccounts() {
    try {
      var r = await api('/api/billing/accounts');
      if (r.ok && Array.isArray(r.data)) accounts = r.data;
    } catch (e) { /* keep the list on screen */ }
    var a = selected && accountById(selected);
    if (!a || !a.canUpload) selected = null;
    renderTree(); renderSelected();
    preselect();
  }
  // upload.html?acct=<id> (the dashboard's AI 재실행 link) selects that account once, when it may upload
  var wanted = (function () {
    try { var v = new URLSearchParams(location.search).get('acct'); return v && ID_RE.test(v) ? v : null; } catch (e) { return null; }
  })();
  function preselect() {
    if (!wanted || selected) return;
    var a = accountById(wanted);
    if (!a || !a.canUpload) return;
    wanted = null;
    choose(a.id);
  }
  function renderSelected() {
    var a = selected && accountById(selected);
    $('up-selected').textContent = a ? '선택: ' + (a.name || a.id) : '선택된 account가 없습니다.';
    $('up-start').disabled = !a || uploading;
    $('up-hist-note').textContent = a ? '' : 'account를 선택하면 이력이 표시됩니다.';
  }
  function choose(id) {
    var a = accountById(id);
    if (!a || !a.canUpload || uploading) return;
    selected = id; rows = [];
    failedUpload = null; $('up-discard').hidden = true;
    say('up-msg', '');
    renderTree(); renderSelected(); renderRows();
    refresh();
  }

  async function addKnown() {
    var id = $('up-known-id').value.trim();
    if (!ID_RE.test(id)) return say('up-known-msg', 'account id 형식이 올바르지 않습니다', 'err');
    say('up-known-msg', '');
    try {
      var r = await api('/api/billing/accounts/known', 'POST', { accountId: id });
      if (r.status === 403) return say('up-known-msg', '권한이 없습니다', 'err');
      if (!r.ok) return say('up-known-msg', errText(r, '추가하지 못했습니다'), 'err');
      $('up-known-id').value = '';
      say('up-known-msg', '추가했습니다', 'ok');
      await loadAccounts();
    } catch (e) { say('up-known-msg', '네트워크 오류가 발생했습니다', 'err'); }
  }

  // ---------- form ----------
  function source() { return $('up-src-cur').checked ? 'cur' : 'cot'; }
  function renderCap() {
    $('up-cap').textContent = CAP[source()] + ' · 최대 ' + mb(LIMITS[source()]);
  }
  function setProgress(done, total) {
    var pct = total ? Math.min(100, Math.floor(done * 100 / total)) : 0;
    var bar = $('up-progress');
    bar.hidden = false;
    bar.setAttribute('aria-valuenow', String(pct));
    bar.firstElementChild.style.width = pct + '%';
  }
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  function retryMs(k) { return (typeof window.TB_RETRY_MS === 'number' ? window.TB_RETRY_MS : 500) * Math.pow(2, k); }

  // one part: network errors and 5xx are retried, anything else fails at once
  async function putPart(url, blob) {
    var last = null;
    for (var k = 0; k <= RETRIES; k++) {
      if (k) await sleep(retryMs(k - 1));
      try {
        var res = await fetch(url, { method: 'PUT', body: blob });
        if (res.ok) {
          var etag = res.headers && res.headers.get('ETag');
          if (etag) return etag;
          last = new Error('ETag 없음');
        } else if (res.status >= 500) {
          last = new Error('HTTP ' + res.status);
        } else {
          throw Object.assign(new Error('HTTP ' + res.status), { fatal: true });
        }
      } catch (e) {
        if (e && e.fatal) throw e;
        last = e;
      }
    }
    throw last || new Error('part failed');
  }
  async function putAll(file, urls, partSize) {
    var etags = new Array(urls.length), next = 0, done = 0, failed = null;
    async function worker() {
      while (!failed) {
        var i = next++;
        if (i >= urls.length) return;
        var from = i * partSize;
        try {
          etags[i] = await putPart(urls[i], file.slice(from, Math.min(file.size, from + partSize)));
        } catch (e) { failed = failed || e; return; }
        done += Math.min(file.size, from + partSize) - from;
        setProgress(done, file.size);
      }
    }
    var workers = [];
    for (var w = 0; w < Math.min(PARALLEL, urls.length); w++) workers.push(worker());
    await Promise.all(workers);
    if (failed) throw failed;
    return etags;
  }

  function offerDiscard(acct, uploadId) {
    failedUpload = { acct: acct, uploadId: uploadId };
    $('up-discard').hidden = false;
  }
  // statuses that mean the upload was accepted for analysis
  var COMPLETE_OK = ['queued', 'running', 'done'];
  // the server answers 503 when it cannot yet verify a completed object and expects the same
  // complete to be retried; transient failures retry with backoff before discard is offered
  var COMPLETE_RETRY_MS = [2000, 4000, 8000, 16000, 30000];
  async function completeWithRetry(acct, uploadId, parts) {
    for (var i = 0; ; i++) {
      var c = null;
      try { c = await api(base(acct) + '/uploads/' + encodeURIComponent(uploadId) + '/complete', 'POST', { parts: parts }); } catch (e) { c = null; }
      var transient = !c || c.status === 429 || c.status === 502 || c.status === 503 || c.status === 504;
      if (!transient || i >= COMPLETE_RETRY_MS.length) return c || { ok: false, status: 0, data: null };
      say('up-msg', '업로드 확인을 다시 시도하는 중입니다 (' + (i + 1) + '/' + COMPLETE_RETRY_MS.length + ')');
      await new Promise(function (r) { setTimeout(r, COMPLETE_RETRY_MS[i]); });
    }
  }
  async function startUpload() {
    var a = selected && accountById(selected);
    var file = $('up-file').files && $('up-file').files[0];
    var src = source();
    if (!a || !a.canUpload) return say('up-msg', 'account를 선택하세요', 'err');
    if (!file) return say('up-msg', '파일을 선택하세요', 'err');
    if (!(file.size > 0)) return say('up-msg', '빈 파일입니다', 'err');
    if (file.size > LIMITS[src]) return say('up-msg', '파일이 너무 큽니다. ' + src.toUpperCase() + '는 최대 ' + mb(LIMITS[src]) + '입니다', 'err');
    var acct = a.id, uploadId = null;
    uploading = true; failedUpload = null; $('up-discard').hidden = true;
    $('up-start').disabled = true;
    setProgress(0, file.size);
    say('up-msg', '업로드를 준비하는 중입니다');
    try {
      var r = await api(base(acct) + '/uploads', 'POST', { source: src, fileName: file.name, size: file.size });
      if (r.status === 409) return say('up-msg', LOCKED, 'err');
      if (r.status === 413) return say('up-msg', '파일이 너무 큽니다', 'err');
      if (r.status === 403) return say('up-msg', '권한이 없습니다', 'err');
      if (!r.ok || !r.data || !Array.isArray(r.data.urls)) return say('up-msg', errText(r, '업로드를 시작하지 못했습니다'), 'err');
      uploadId = r.data.uploadId;
      activeUpload = uploadId;
      var ps = r.data.partSize;
      if (!(ps > 0) || r.data.urls.length !== Math.ceil(file.size / ps)) throw new Error('part plan mismatch');
      say('up-msg', '업로드 중입니다. 이 창을 닫지 마세요');
      refresh();
      var etags = await putAll(file, r.data.urls, ps);
      var parts = etags.map(function (etag, i) { return { n: i + 1, etag: etag }; }).sort(function (x, y) { return x.n - y.n; });
      say('up-msg', '업로드를 마무리하는 중입니다');
      var c = await completeWithRetry(acct, uploadId, parts);
      var st = c.ok && c.data ? c.data.status : null;
      if (c.ok && (st === 'discarded' || st === 'failed')) {
        return say('up-msg', st === 'discarded' ? '이 업로드는 이미 폐기되었습니다. 파일을 다시 업로드하세요' : '이 업로드는 실패로 처리되었습니다. 파일을 다시 업로드하세요', 'err');
      }
      if (!c.ok || COMPLETE_OK.indexOf(st) < 0) {
        offerDiscard(acct, uploadId);
        return say('up-msg', errText(c, '업로드를 완료하지 못했습니다') + ' 이 업로드를 폐기하고 다시 시도할 수 있습니다', 'err');
      }
      say('up-msg', '업로드를 마쳤습니다. 분석이 곧 시작됩니다', 'ok');
      $('up-file').value = '';
    } catch (e) {
      if (uploadId) offerDiscard(acct, uploadId);
      say('up-msg', '업로드에 실패했습니다' + (uploadId ? '. 이 업로드를 폐기하고 다시 시도할 수 있습니다' : ''), 'err');
    } finally {
      uploading = false; activeUpload = null;
      renderSelected();
      refresh();
    }
  }
  async function discardFailed() {
    var f = failedUpload;
    if (!f) return;
    try {
      var r = await api(base(f.acct) + '/uploads/' + encodeURIComponent(f.uploadId) + '/discard', 'POST', {});
      if (!r.ok) return say('up-msg', errText(r, '폐기하지 못했습니다'), 'err');
      failedUpload = null; $('up-discard').hidden = true;
      $('up-progress').hidden = true;
      say('up-msg', '폐기했습니다. 다시 업로드할 수 있습니다', 'ok');
      refresh();
    } catch (e) { say('up-msg', '네트워크 오류가 발생했습니다', 'err'); }
  }

  // ---------- history ----------
  function isCurrent(r) {
    var a = accountById(r.accountId || selected);
    var s = a && a.sources && a.sources[r.source];
    return !!(s && s.versionId === r.versionId);
  }
  function act(label, fn, cls) {
    var b = el('button', 'up-btn small ' + (cls || 'ghost'), label);
    b.type = 'button';
    b.addEventListener('click', function () { b.disabled = true; fn().then(function () { b.disabled = false; }); });
    return b;
  }
  async function post(path, body, okMsg) {
    say('up-act-msg', '');
    try {
      var r = await api(path, 'POST', body);
      if (!r.ok) say('up-act-msg', errText(r, '요청을 처리하지 못했습니다'), 'err');
      else say('up-act-msg', okMsg, 'ok');
      return r.ok;
    } catch (e) { say('up-act-msg', '네트워크 오류가 발생했습니다', 'err'); return false; }
  }
  function renderRows() {
    var tb = $('up-hist-body');
    tb.textContent = '';
    var a = selected && accountById(selected);
    rows.forEach(function (r) {
      var tr = el('tr');
      tr.setAttribute('data-id', r.uploadId);
      tr.setAttribute('data-status', r.status);
      tr.appendChild(el('td', 'nw', a ? a.name || a.id : r.accountId));
      tr.appendChild(el('td', '', (r.source ? r.source.toUpperCase() + ' · ' : '') + (r.fileName || '') + (r.size ? ' (' + fmtSize(r.size) + ')' : '')));
      tr.appendChild(el('td', '', r.uploaderEmail || ''));
      tr.appendChild(el('td', 'nw', fmtTime(r.createdAt)));
      tr.appendChild(el('td', 'nw', fmtPeriod(r.period)));
      var st = el('td', 'nw');
      st.appendChild(el('span', 'up-status ' + r.status, STATUS[r.status] || r.status));
      if (r.status === 'done' && isCurrent(r)) st.appendChild(el('span', 'up-chip done', '현재'));
      if (isStale(r)) st.appendChild(el('span', 'up-chip stale', '응답 없음'));
      tr.appendChild(st);
      var cell = el('td'), chips = el('div', 'up-chips');
      STEPS.forEach(function (s) {
        var state = r.steps && r.steps[s[0]] ? String(r.steps[s[0]]) : 'waiting';
        var c = el('span', 'up-chip ' + state.replace(/[^a-z_]/g, ''), s[1]);
        c.title = state;
        chips.appendChild(c);
      });
      cell.appendChild(chips); tr.appendChild(cell);
      tr.appendChild(el('td', 'reason', r.reason || '')); // zip entry names can appear here: text only
      var ac = el('td'), box = el('div', 'up-acts');
      var id = encodeURIComponent(r.uploadId), root = base(r.accountId || selected);
      if (discardable(r)) {
        box.appendChild(act('폐기', async function () {
          if (await post(root + '/uploads/' + id + '/discard', {}, '폐기했습니다')) refresh();
        }));
      }
      if (r.status === 'done' && !isCurrent(r)) {
        box.appendChild(act('현재 버전으로', async function () {
          if (await post(root + '/current', { source: r.source, versionId: r.versionId }, '현재 버전으로 지정했습니다')) { await loadAccounts(); refresh(); }
        }, ''));
      }
      if (r.status === 'done') {
        box.appendChild(act('AI 재실행', async function () {
          if (await post(root + '/rerun-agents', { source: r.source, versionId: r.versionId }, 'AI 재실행을 요청했습니다')) refresh();
        }));
      }
      ac.appendChild(box); tr.appendChild(ac);
      tb.appendChild(tr);
    });
    if (selected && !rows.length) $('up-hist-note').textContent = '아직 업로드 이력이 없습니다.';
    else if (selected) $('up-hist-note').textContent = '';
  }

  // ---------- polling ----------
  // stale: a queued/running row the worker can no longer finish (server flag); it is discardable and not polled
  function isStale(r) { return (r.status === 'queued' || r.status === 'running') && r.stale === true; }
  function busy(r) { return (r.status === 'queued' || r.status === 'running') && !isStale(r); }
  // uploading rows this tab is not sending right now may be given up (the server aborts the multipart upload)
  function discardable(r) {
    return r.status === 'needs_review' || r.status === 'failed' || isStale(r) || (r.status === 'uploading' && r.uploadId !== activeUpload);
  }
  function needsPoll() {
    return uploading || rows.some(busy);
  }
  function stopPoll() { if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }
  function schedule() {
    stopPoll();
    if (document.hidden || !selected || !needsPoll()) return;
    pollTimer = setTimeout(refresh, typeof window.TB_POLL_MS === 'number' ? window.TB_POLL_MS : 5000);
  }
  var seq = 0;
  async function refresh() {
    stopPoll();
    var acct = selected, mine = ++seq;
    if (!acct) return;
    try {
      var r = await api(base(acct) + '/uploads');
      if (mine !== seq || acct !== selected) return; // a newer refresh or another account won
      if (r.status === 403) { rows = []; $('up-hist-note').textContent = '권한이 없습니다'; }
      else if (r.ok && Array.isArray(r.data)) {
        var wasBusy = rows.some(busy);
        rows = r.data;
        if (wasBusy && !needsPoll()) loadAccounts(); // a finished run may have changed the current version
      }
      renderRows();
    } catch (e) { /* keep the last rows, retry on the next tick */ }
    schedule();
  }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopPoll(); else refresh();
  });

  // ---------- wiring ----------
  $('up-known-add').addEventListener('click', addKnown);
  $('up-known-id').addEventListener('keydown', function (e) { if (e.key === 'Enter') addKnown(); });
  $('up-start').addEventListener('click', startUpload);
  $('up-discard').addEventListener('click', discardFailed);
  document.querySelectorAll('input[name="up-source"]').forEach(function (r) { r.addEventListener('change', renderCap); });
  renderCap();
  renderTree(); renderSelected();
  if (!Array.isArray(window.TB_ACCOUNTS)) loadAccounts(); else preselect();
})();
</script>
