name: Build Mac App

on:
  push:
    branches: [main]
    paths:
      - 'mac-app/**'
      - '.github/workflows/build-mac-app.yml'
  pull_request:
    paths:
      - 'mac-app/**'
      - '.github/workflows/build-mac-app.yml'
  workflow_dispatch:

concurrency:
  group: build-mac-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: tauri build (${{ matrix.target }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mac-app/src-tauri -> target
          key: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tauri CLI deps
        working-directory: mac-app
        run: npm ci || npm install

      - name: Build
        working-directory: mac-app
        env:
          TARGET: ${{ matrix.target }}
        run: npm run build -- --target "$TARGET" --verbose

      - name: Upload bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ttobak-mac-${{ matrix.target }}
          path: |
            mac-app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            mac-app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: warn
          retention-days: 7
