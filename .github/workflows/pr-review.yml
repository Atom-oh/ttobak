name: AI Code Review

# Trusted-base review: twelve cells (three models x four lenses), then a chair.
# Never execute PR-head code in pull_request_target. All reviewers receive the
# same compact base-revision AGENTS.md context; isolated Kiro cells get it inline.

on:
  pull_request_target:
    types: [opened, synchronize]

jobs:
  review:
    name: AI Code Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ttobak-claude-arm
    # Worst case: 15-minute panel + 2-minute fast failure + 25-minute fallback,
    # plus setup and publication. A slow primary failure skips fallback.
    timeout-minutes: 60
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read
    env:
      # claude-fable-5-1 is a global inference profile, but "global." only affects Bedrock's
      # routing after the request lands, not the SigV4 signing region — that must still
      # match ANTHROPIC_BEDROCK_BASE_URL's endpoint or signing fails (unlike Codex's
      # amazon-bedrock-runtime provider, which has no such constraint). Both moved as a
      # matched pair from us-east-1 to the nearest region (ap-northeast-2/Seoul).
      ANTHROPIC_MODEL: global.anthropic.claude-fable-5-1
      CLAUDE_CODE_USE_BEDROCK: 1
      ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.ap-northeast-2.amazonaws.com
      AWS_REGION: ap-northeast-2
    steps:
      # Privileged event: check out the trusted base; treat the PR diff as data.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify CLIs present (runner image)
        run: |
          command -v claude >/dev/null 2>&1 || { echo "::warning::claude not found"; npm install -g @anthropic-ai/claude-code; }
          claude --version
          for c in codex kiro-cli; do
            command -v "$c" >/dev/null 2>&1 || echo "::warning::$c not found on runner (image needs rebuild)"
          done

      - name: Check chair timeout/fallback policy (seconds)
        # Validate the existing timeout policy before invoking external reviewers.
        run: bash scripts/pr-review/chair-timeout-policy-check.sh

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff-raw.txt
          awk '
            /^diff --git/ {
              path = substr($3, 3)
              skip = (path ~ /(^|\/)package-lock\.json$/) ||
                     (path ~ /(^|\/)pnpm-lock\.yaml$/) ||
                     (path ~ /(^|\/)yarn\.lock$/) ||
                     (path ~ /(^|\/)node_modules\//) ||
                     (path ~ /\.(pptx|png|jpg|jpeg|gif|pdf|vsix|zip)$/) ||
                     (path ~ /(^|\/)(dist|out|build)\//) ||
                     (path ~ /\.terraform\.lock\.hcl$/)
            }
            !skip
          ' /tmp/pr-diff-raw.txt > /tmp/pr-diff.txt
          echo "total_lines=$(wc -l < /tmp/pr-diff.txt)" >> "$GITHUB_ENV"

      - name: Build lens prompts (L2-L5 — each self-contained, one lens only)
        run: |
          set -euo pipefail
          MAX_LINES=3000
          head -"$MAX_LINES" /tmp/pr-diff.txt > /tmp/pr-diff-truncated.txt
          rm -rf /tmp/pr-review/lenses
          mkdir -p /tmp/pr-review/lenses
          python3 scripts/pr-review/build-prompts.py "$GITHUB_WORKSPACE" /tmp/pr-review/lenses
          for lens in L2 L3 L4 L5; do
            test -s "/tmp/pr-review/lenses/${lens}.txt" || { echo "::error::missing lens ${lens}"; exit 1; }
          done

          if [ "${total_lines:-0}" -gt "$MAX_LINES" ]; then
            for f in /tmp/pr-review/lenses/*.txt; do
              echo "WARNING: diff was ${total_lines} lines; only the first ${MAX_LINES} were reviewed." >> "$f"
            done
            echo "panel_truncated=1" >> "$GITHUB_ENV"
          fi

      - name: Run panel + synthesize (lens×model matrix -> Claude chair)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PANEL_TIMEOUT: "300"
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-review
          bash scripts/pr-review/run-panel.sh /tmp/pr-diff-truncated.txt /tmp/pr-review/lenses /tmp/pr-review
          bash scripts/pr-review/synthesize.sh /tmp/pr-diff-truncated.txt /tmp/pr-review \
            "$PR_NUMBER" "$PR_TITLE" /tmp/review.md
          echo "panel_responded=$(tr '\n' ' ' < /tmp/pr-review/responded.txt 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Check for blocking issues
        id: gate
        run: |
          if grep -q "^VERDICT: FAIL$" /tmp/review.md; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
          elif grep -q "^VERDICT: PASS$" /tmp/review.md; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - name: Post review comment (upsert)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GATE_RESULT: ${{ steps.gate.outputs.result }}
        run: |
          MARKER="<!-- multi-ai-pr-review -->"
          if [ "$GATE_RESULT" = "fail" ]; then
            STATUS_BADGE="**Status: BLOCKED** — CRITICAL/MAJOR issues must be resolved before merge"
          else
            STATUS_BADGE="**Status: PASSED** — No blocking issues found"
          fi
          sed '$ { /^VERDICT:/d }' /tmp/review.md > /tmp/review-clean.md
          {
            echo "$MARKER"
            echo "## 🤖 AI Code Review (${chair_used:-Claude Fable 5} chair · lens×model matrix)"
            echo ""
            echo "_Panel: Claude(chair) · ${panel_responded:-solo}_"
            [ "${panel_truncated:-0}" = "1" ] && echo "_⚠️ diff truncated to first 3000 lines — review is partial._"
            echo ""
            echo "$STATUS_BADGE"
            echo ""
            cat /tmp/review-clean.md
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.event.pull_request.head.sha }}\` · workflow: \`.github/workflows/pr-review.yml\`_"
          } > /tmp/comment.md
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- multi-ai-pr-review -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -f body="$(cat /tmp/comment.md)" 2>/dev/null || \
              gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          fi

      - name: Fail if CRITICAL or MAJOR
        if: steps.gate.outputs.result == 'fail'
        run: |
          echo "AI Review failed"
          exit 1
