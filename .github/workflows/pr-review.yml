name: AI Code Review

# Trusted-base review: twelve cells (three models x four lenses), then a chair.
# Never execute PR-head code in pull_request_target. All reviewers receive the
# same compact base-revision AGENTS.md context; isolated Kiro cells get it inline.

on:
  pull_request_target:
    types: [opened, synchronize]

env:
  GH_TOKEN: ${{ github.token }}
  ROLE_REVIEW: "1"
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  GH_REPO: ${{ github.repository }}

jobs:
  review:
    name: AI Code Review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ttobak-claude-arm
    # Worst case: 15-minute panel + 2-minute fast failure + 25-minute fallback,
    # plus setup and publication. A slow primary failure skips fallback.
    timeout-minutes: 60
    concurrency:
      group: pr-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read
    env:
      # claude-fable-5-1 is a global inference profile, but "global." only affects Bedrock's
      # routing after the request lands, not the SigV4 signing region — that must still
      # match ANTHROPIC_BEDROCK_BASE_URL's endpoint or signing fails (unlike Codex's
      # amazon-bedrock-runtime provider, which has no such constraint). Both moved as a
      # matched pair from us-east-1 to the nearest region (ap-northeast-2/Seoul).
      ANTHROPIC_MODEL: global.anthropic.claude-fable-5-1
      CLAUDE_CODE_USE_BEDROCK: 1
      ANTHROPIC_BEDROCK_BASE_URL: https://bedrock-runtime.ap-northeast-2.amazonaws.com
      AWS_REGION: ap-northeast-2
    steps:
      # Privileged event: check out the trusted base; treat the PR diff as data.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Prepare fresh review workspace
        id: workspace
        run: |
          set -euo pipefail
          umask 077
          test ! -L /tmp/pr-review
          rm -rf -- /tmp/pr-review
          rm -f -- /tmp/review.md /tmp/review-clean.md /tmp/comment.md
          mkdir /tmp/pr-review
          echo "identity=$(stat -c '%d:%i' /tmp/pr-review)" >> "$GITHUB_OUTPUT"

      - name: Verify CLIs present (runner image)
        run: |
          command -v claude >/dev/null 2>&1 || { echo "::warning::claude not found"; npm install -g @anthropic-ai/claude-code; }
          claude --version
          for c in codex kiro-cli; do
            command -v "$c" >/dev/null 2>&1 || echo "::warning::$c not found on runner (image needs rebuild)"
          done

      - name: Check chair timeout/fallback policy (seconds)
        # Validate the existing timeout policy before invoking external reviewers.
        run: bash scripts/pr-review/chair-timeout-policy-check.sh

      - name: Get PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr diff "$PR_NUMBER" > /tmp/pr-diff-raw.txt
          awk '
            /^diff --git/ {
              path = substr($3, 3)
              skip = (path ~ /(^|\/)package-lock\.json$/) ||
                     (path ~ /(^|\/)pnpm-lock\.yaml$/) ||
                     (path ~ /(^|\/)yarn\.lock$/) ||
                     (path ~ /(^|\/)node_modules\//) ||
                     (path ~ /\.(pptx|png|jpg|jpeg|gif|pdf|vsix|zip)$/) ||
                     (path ~ /(^|\/)(dist|out|build)\//) ||
                     (path ~ /\.terraform\.lock\.hcl$/)
            }
            !skip
          ' /tmp/pr-diff-raw.txt > /tmp/pr-diff.txt
          echo "total_lines=$(wc -l < /tmp/pr-diff.txt)" >> "$GITHUB_ENV"

      - name: Build lens prompts (L2-L5 — each self-contained, one lens only)
        run: |
          set -euo pipefail
          MAX_LINES=3000
          head -"$MAX_LINES" /tmp/pr-diff.txt > /tmp/pr-diff-truncated.txt
          rm -rf /tmp/pr-review/lenses
          mkdir -p /tmp/pr-review/lenses
          python3 scripts/pr-review/build-prompts.py "$GITHUB_WORKSPACE" /tmp/pr-review/lenses
          for lens in L2 L3 L4 L5; do
            test -s "/tmp/pr-review/lenses/${lens}.txt" || { echo "::error::missing lens ${lens}"; exit 1; }
          done

          if [ "${total_lines:-0}" -gt "$MAX_LINES" ]; then
            for f in /tmp/pr-review/lenses/*.txt; do
              echo "WARNING: diff was ${total_lines} lines; only the first ${MAX_LINES} were reviewed." >> "$f"
            done
            echo "panel_truncated=1" >> "$GITHUB_ENV"
          fi

      - name: Run specialists and conditionally adjudicate findings
        id: review
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PANEL_TIMEOUT: "300"
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr-review
          bash scripts/pr-review/run-panel.sh /tmp/pr-diff-truncated.txt /tmp/pr-review/lenses /tmp/pr-review
          bash scripts/pr-review/synthesize.sh /tmp/pr-diff-truncated.txt /tmp/pr-review \
            "$PR_NUMBER" "$PR_TITLE" /tmp/review.md
          echo "panel_responded=$(tr '\n' ' ' < /tmp/pr-review/responded.txt 2>/dev/null)" >> "$GITHUB_ENV"

      - name: Validate and stage specialist evidence
        id: artifact_input
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' }}
        env:
          WORKSPACE_ID: ${{ steps.workspace.outputs.identity }}
        run: |
          python3 - <<'PY'
          import contextlib
          import os
          from pathlib import Path
          import shutil
          import stat
          import tempfile

          tags = ("codex", "kiro-fable", "kiro-sol", "claude-self")
          root_names = {"role-plan.json", "role-summary.json", "role-source.json"}
          slot_names = {f"{tag}-{kind}.json" for tag in tags for kind in ("result", "request", "timing")}
          slot_names |= {name for tag in tags for name in (
              f"{tag}-duplicate.flag", f"role-{tag}-terminal.flag", f"kiro-preflight-{tag}.flag")}
          slot_names |= {"kiro-preflight.flag"} | {f"{tag}-execution.flag" for tag in tags}
          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          stage = None
          try:
              with contextlib.ExitStack() as stack:
                  def open_directory(name, parent=None):
                      fd = os.open(name, directory_flags, dir_fd=parent)
                      stack.callback(os.close, fd)
                      return fd

                  root = open_directory("/tmp/pr-review")
                  info = os.fstat(root)
                  if f"{info.st_dev}:{info.st_ino}" != os.environ["WORKSPACE_ID"]:
                      raise ValueError("workspace identity changed")
                  candidates = [(root, name, name) for name in sorted(root_names) if name in os.listdir(root)]
                  if "slot" in os.listdir(root):
                      slot = open_directory("slot", root)
                      for name in sorted(os.listdir(slot)):
                          if name.endswith(("-result.json", "-request.json", "-timing.json", ".flag")):
                              if name not in slot_names:
                                  raise ValueError("unexpected artifact name")
                              candidates.append((slot, name, "slot/" + name))
                  if not candidates:
                      raise ValueError("no evidence")
                  stage = Path(tempfile.mkdtemp(prefix="pr-review-evidence-", dir=os.environ["RUNNER_TEMP"]))
                  for parent, name, relative in candidates:
                      # Pin the directory FD and open without following links, including
                      # replacements between listing and opening. NONBLOCK avoids FIFO hangs.
                      fd = os.open(name, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=parent)
                      with os.fdopen(fd, "rb") as source:
                          before = os.fstat(source.fileno())
                          if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or before.st_uid != os.geteuid():
                              raise ValueError("artifact is not an owned regular file")
                          target = stage / relative
                          target.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                          with target.open("xb") as destination:
                              shutil.copyfileobj(source, destination)
                          after = os.fstat(source.fileno())
                          if (before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                              raise ValueError("artifact changed during copy")
                  # Publish only private regular copies, never the mutable source tree.
                  with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                      output.write(f"path={stage}\n")
          except (OSError, ValueError):
              if stage is not None:
                  shutil.rmtree(stage)
              raise SystemExit("Unsafe or missing specialist evidence; upload withheld")
          PY

      - name: Preserve specialist scope and execution evidence
        id: evidence
        if: ${{ !cancelled() && steps.workspace.outcome == 'success' && steps.artifact_input.outcome == 'success' && steps.artifact_input.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: specialist-review-${{ github.event.pull_request.head.sha }}-${{ github.run_attempt }}
          path: ${{ steps.artifact_input.outputs.path }}
          if-no-files-found: error

      - name: Check for blocking issues
        id: gate
        if: ${{ !cancelled() }}
        env:
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          ARTIFACT_INPUT_OUTCOME: ${{ steps.artifact_input.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          result=fail
          reason=invalid_review
          if [ "$WORKSPACE_OUTCOME" != success ]; then
            reason=workspace_initialization_failed
          elif [ "$ARTIFACT_INPUT_OUTCOME" != success ]; then
            reason=unsafe_or_missing_evidence
          elif [ "$REVIEW_OUTCOME" != success ]; then
            reason=review_execution_failed
          elif [ "$EVIDENCE_OUTCOME" != success ] || [[ ! "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]; then
            reason=evidence_unavailable
          elif [ "${chair_failed:-0}" = 1 ]; then
            reason=review_incomplete
          elif [ -s /tmp/review.md ] && [ "$(grep -c '^VERDICT:' /tmp/review.md)" = 1 ] &&
               [ "$(awk 'NF{n++} END{print n+0}' /tmp/review.md)" -gt 1 ]; then
            case "$(awk 'NF{last=$0} END{print last}' /tmp/review.md)" in
              "VERDICT: PASS") result=pass; reason=complete ;;
              "VERDICT: FAIL") reason=blocking_review ;;
            esac
          fi
          {
            echo "result=$result"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Post review comment (upsert)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          GATE_RESULT: ${{ steps.gate.outputs.result }}
          GATE_REASON: ${{ steps.gate.outputs.reason }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          WORKSPACE_OUTCOME: ${{ steps.workspace.outcome }}
          ARTIFACT_INPUT_OUTCOME: ${{ steps.artifact_input.outcome }}
          REVIEW_OUTCOME: ${{ steps.review.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        run: |
          set -euo pipefail
          CURRENT_HEAD="$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::error::PR head changed; this review belongs to an older commit"
            exit 1
          fi
          MARKER="<!-- multi-ai-pr-review -->"
          STATUS_BADGE="**Status: BLOCKED** — required review execution, evidence or coverage is incomplete"
          if [ "$GATE_OUTCOME" = success ] && [ "$GATE_RESULT" = pass ] && [ "$GATE_REASON" = complete ]; then
            STATUS_BADGE="**Status: PASSED** — No blocking issues found"
          elif [ "$GATE_OUTCOME" = success ] && [ "$GATE_REASON" = blocking_review ]; then
            STATUS_BADGE="**Status: BLOCKED** — CRITICAL/MAJOR issues must be resolved before merge"
          fi
          # Operational failures must not reuse a partial or stale PASS report.
          if [ "$GATE_OUTCOME" = success ] && { [ "$GATE_REASON" = complete ] || [ "$GATE_REASON" = blocking_review ]; }; then
            sed '/^VERDICT:/d' /tmp/review.md > /tmp/review-clean.md
          else
            echo "No complete review with successfully archived evidence is available. This run cannot authorize merge." > /tmp/review-clean.md
          fi

          {
            echo "$MARKER"
            echo "## AI Code Review — specialists"
            echo "_Synthesis: ${chair_used:-pending}_"
            echo ""
            echo "_Panel: Claude(chair) · ${panel_responded:-solo}_"
            [ "${panel_truncated:-0}" = "1" ] && echo "_⚠️ diff truncated to first 3000 lines — review is partial._"
            echo ""
            echo "$STATUS_BADGE"
            echo "Workspace initialization: ${WORKSPACE_OUTCOME:-missing} · Evidence validation: ${ARTIFACT_INPUT_OUTCOME:-missing}"
            echo "Review execution: ${REVIEW_OUTCOME:-missing} · Evidence upload: ${EVIDENCE_OUTCOME:-missing} · Gate: ${GATE_OUTCOME:-missing} (${GATE_REASON:-missing})"
            echo "Workflow run: ${{ github.run_id }} · attempt: ${{ github.run_attempt }}"
            echo ""
            cat /tmp/review-clean.md
            echo ""
            echo "---"
            echo "_Triggered by commit \`${{ github.event.pull_request.head.sha }}\` · workflow: \`.github/workflows/pr-review.yml\`_"
          } > /tmp/comment.md
          EXISTING=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.body | contains("<!-- multi-ai-pr-review -->")) | .id' 2>/dev/null | head -1)
          if [ -n "$EXISTING" ]; then
            gh api "repos/$REPO/issues/comments/$EXISTING" -X PATCH -f body="$(cat /tmp/comment.md)" 2>/dev/null || \
              gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
          fi

      - name: Fail if CRITICAL or MAJOR
        if: ${{ !cancelled() && (steps.gate.outcome != 'success' || steps.gate.outputs.result != 'pass') }}
        run: |
          echo "AI Review failed"
          exit 1
