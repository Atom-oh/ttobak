name: Test Billing

on:
  push:
    branches: [main]
    paths:
      - 'services/billing/**'
      # generated pages: the page step checks they match build_page.py output
      - 'frontend/public/billing-app/**'
  pull_request:
    paths:
      - 'services/billing/**'
      # generated pages: the page step checks they match build_page.py output
      - 'frontend/public/billing-app/**'
      # Re-run on workflow changes so PRs that only touch CI still trigger
      # the required `test` check (branch protection blocks otherwise).
      - '.github/workflows/test-billing.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ttobak-arm
    # Public repo + self-hosted runner with ambient deploy credentials:
    # never run fork-PR code here (see test-infra.yml's identical guard).
    # push events have no pull_request context, so let them through.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Run BFF tests
        working-directory: services/billing/bff
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Run page build tests
        working-directory: services/billing/page
        run: |
          npm ci --no-audit --no-fund
          python3 -m unittest test_build_page -v
