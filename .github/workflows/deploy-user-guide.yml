name: Deploy User Guide

on:
  push:
    branches: [main]
    paths:
      - 'docs/user-guide/**'
      - 'scripts/docs/build_user_guide.py'
      - '.github/workflows/deploy-user-guide.yml'
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - 'scripts/docs/build_user_guide.py'
      - '.github/workflows/deploy-user-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate and package public guide
        run: python3 scripts/docs/build_user_guide.py --output "${{ runner.temp }}/user-guide-site"
      - name: Validate guide JavaScript
        run: node --check docs/user-guide/guide.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/user-guide-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: user-guide-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # This check runs inside the deployment lock: an older, slower build or
      # a rerun of an old workflow must never replace a newer main deployment.
      - name: Check current main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded guide revision."
          fi
      - name: Deploy user guide to GitHub Pages
        id: deployment
        if: steps.current.outputs.publish == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
