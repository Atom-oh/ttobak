name: Deploy User Guide

on:
  push:
    branches: [main]
    # Every new main SHA needs a replacement run, even for unrelated changes:
    # the serialized deploy job deliberately skips any superseded SHA.
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - 'scripts/docs/build_user_guide.py'
      - 'scripts/docs/test_build_user_guide.py'
      - '.github/workflows/deploy-user-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

# Keep the entire build/deploy lifecycle in the same FIFO queue. Unlike the
# default single pending slot, queue:max does not let a slower old run cancel
# the latest pending run. GitHub supports up to 100 queued runs.
concurrency:
  group: user-guide-${{ github.event.pull_request.number || github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.current.outputs.publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate and package public guide
        run: python3 scripts/docs/build_user_guide.py --output "${{ runner.temp }}/user-guide-site"
      - name: Test public guide publication boundaries
        run: python3 -m unittest discover -s scripts/docs -p 'test_build_user_guide.py' -v
      - name: Validate guide JavaScript
        run: node --check docs/user-guide/guide.js
      # Runs under the workflow lock and before entering the Pages environment:
      # a stale run cannot publish or record a successful environment deployment.
      - name: Check current main revision
        id: current
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [ "$current_sha" = "$EXPECTED_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded guide revision."
          fi
      - name: Upload Pages artifact
        if: steps.current.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/user-guide-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy user guide to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
