name: Deploy User Guide

on:
  push:
    branches: [main]
    paths:
      - 'docs/user-guide/**'
      - 'scripts/docs/build_user_guide.py'
      - '.github/workflows/deploy-user-guide.yml'
  pull_request:
    paths:
      - 'docs/user-guide/**'
      - 'scripts/docs/build_user_guide.py'
      - '.github/workflows/deploy-user-guide.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate and package public guide
        run: python3 scripts/docs/build_user_guide.py --output "${{ runner.temp }}/user-guide-site"
      - name: Validate guide JavaScript
        run: node --check docs/user-guide/guide.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/user-guide-site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: user-guide-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy user guide to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
