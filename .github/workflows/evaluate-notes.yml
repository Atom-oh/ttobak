name: Evaluate Note Quality

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: note-quality-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/main'
    runs-on: ttobak-claude-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Restore and verify PDF font dependency
        run: |
          npm --prefix backend/internal/service/pdfassets ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend/internal/service/pdfassets run verify

      - name: Verify evaluator offline
        run: |
          python3 -m unittest discover -s scripts -p 'test_prepare_note_evaluation.py' -v
          go -C backend test ./internal/service \
            -run '^Test(NativeQuality|NoteQualityRubric|NoteQualityEvidence|NoteQualityRejectsSharedProfileEndpointOverrides)' \
            -count=1

      - name: Read deployed model configuration
        env:
          AWS_REGION: ap-northeast-2
        run: |
          set -euo pipefail
          echo "EVAL_DIRECTORY=$RUNNER_TEMP/note-quality-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          aws lambda get-function-configuration \
            --function-name ttobak-summarize --region ap-northeast-2 \
            --query '{summaryModelId:Environment.Variables.BEDROCK_SUMMARY_MODEL_ID,auxiliaryModelId:Environment.Variables.BEDROCK_MODEL_ID,region:Environment.Variables.BEDROCK_REGION,codeSha256:CodeSha256,state:State,lastUpdateStatus:LastUpdateStatus,revisionId:RevisionId}' \
            --output json > "$RUNNER_TEMP/note-model.json"
          python3 scripts/prepare-note-evaluation.py "$RUNNER_TEMP/note-model.json" "$GITHUB_ENV"

      - name: Evaluate four synthetic meetings with the real model
        run: |
          TTOBAK_GO_BINARY="$(command -v go)" \
            scripts/eval-note-quality.sh live "$EVAL_DIRECTORY"

      - name: Preserve deployment discovery evidence
        if: always() && env.EVAL_DIRECTORY != ''
        run: |
          if [ -d "$EVAL_DIRECTORY" ] && [ -f "$RUNNER_TEMP/note-model.json" ]; then
            cp "$RUNNER_TEMP/note-model.json" "$EVAL_DIRECTORY/deployed-model.json"
          fi

      - uses: actions/upload-artifact@v4
        if: always() && env.EVAL_DIRECTORY != ''
        with:
          name: note-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.EVAL_DIRECTORY }}
          if-no-files-found: warn
          retention-days: 14
