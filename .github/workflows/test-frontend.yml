name: Test Frontend

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/test-frontend.yml']
  pull_request:
    paths: ['frontend/**', '.github/workflows/test-frontend.yml']

permissions:
  contents: read

jobs:
  frontend-unit:
    runs-on: ttobak-arm
    # Match the backend gate: fork PRs cannot execute on this self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Unit tests and lint
        working-directory: frontend
        run: |
          npm ci
          npm run test:unit
          npm run lint
