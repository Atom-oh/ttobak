name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', 'backend/cmd/**', 'backend/internal/**', 'backend/go.*', 'backend/python/qa/**', 'backend/python/crawler/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  # Separate job (not a step) so failure gates EVERYTHING in deploy —
  # including its `if: always()` OAC re-tighten step, which as a sibling
  # step would still run after a failed in-job gate and deploy
  # TtobakStorageStack on a red test suite.
  infra-tests:
    runs-on: ttobak-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Infra synth + unit tests (gate before any deploy)
        # Security invariants live in these jest assertions (e.g.
        # whisper-stack.test.ts's "no EntryPoint/Command on the whisperx
        # task definition" guard) — deploying without running them would
        # let a silently-bypassing CDK edit auto-ship on push-to-main.
        # `cdk synth` must gate here too: jest's per-stack synth uses dummy
        # envs and misses full-app synth errors, and the deploy job's
        # `cdk diff || true` swallows them — without this line they'd first
        # surface mid-`cdk deploy`.
        working-directory: infra
        run: |
          npm ci
          npx cdk synth
          npm test

  deploy:
    runs-on: ttobak-arm
    needs: infra-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Match backend/go.mod's `go 1.25.0` (see test-backend.yml). With
          # '1.24' the build fails with `go.mod requires go >= 1.25.0`.
          go-version: '1.25'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o /tmp/awscli.zip
          unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install --install-dir $HOME/.local/aws-cli --bin-dir $HOME/.local/bin --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Go Lambda binaries
        working-directory: backend
        run: |
          for dir in cmd/api cmd/transcribe cmd/summarize cmd/process-image cmd/kb cmd/research-worker; do
            GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o "$dir/bootstrap" "./$dir"
          done

      - name: CDK deploy
        working-directory: infra
        run: |
          npm ci
          npx cdk diff 2>&1 || true
          # Never `--all` and never list stacks without `--exclusively`:
          # either one pulls in each named stack's full dependency closure,
          # which includes TtobakKnowledgeStack -- it stages a deliberate,
          # undeployed Bedrock KB teardown that would apply for real (see
          # CLAUDE.md Known Issues). Deploy every other stack individually
          # with --exclusively, in dependency order (see infra/bin/infra.ts
          # addDependency calls), so TtobakKnowledgeStack is never touched.
          # A stack with no changes is a no-op under --exclusively, so
          # running this same full list every push is safe -- it does not
          # mean every stack redeploys on every change.
          npx cdk deploy TtobakWebSearchGatewayStack --exclusively --require-approval never
          npx cdk deploy TtobakStorageStack --exclusively --require-approval never
          npx cdk deploy TtobakAuthStack --exclusively --require-approval never
          # ttobak-agentcore-research-role is a manually-created,
          # pre-existing IAM resource (not produced by any CI pipeline) --
          # TtobakAiStack imports it by ARN and attaches an inline policy to
          # it, so this deploy role's credentials must already be able to
          # mutate IAM roles generally (a strictly higher privilege than
          # iam:GetRole). Verify existence right before that stack to fail
          # fast with a clear message instead of an obscure CFN
          # inline-policy-attach error -- but if the read itself is denied
          # for some unrelated policy reason, don't let this precondition
          # check become a NEW failure mode; warn and let the real
          # CFN deploy be the source of truth.
          if ! ROLE_CHECK=$(aws iam get-role --role-name ttobak-agentcore-research-role 2>&1); then
            if echo "$ROLE_CHECK" | grep -q 'NoSuchEntity'; then
              echo "::error::ttobak-agentcore-research-role does not exist -- create it before deploying TtobakAiStack (see CLAUDE.md Known Issues)."
              exit 1
            fi
            echo "::warning::Could not verify ttobak-agentcore-research-role via iam:GetRole ($ROLE_CHECK) -- proceeding, TtobakAiStack's deploy will surface the real error if the role is actually missing."
          fi
          npx cdk deploy TtobakAiStack --exclusively --require-approval never
          npx cdk deploy TtobakEdgeAuthStack --exclusively --require-approval never
          npx cdk deploy TtobakGatewayStack --exclusively --require-approval never
          npx cdk deploy TtobakCrawlerStack --exclusively --require-approval never
          npx cdk deploy TtobakResearchAgentStack --exclusively --require-approval never
          npx cdk deploy TtobakWhisperStack --exclusively --require-approval never
          npx cdk deploy TtobakFrontendStack --exclusively --require-approval never

      - name: CDK deploy — re-tighten TtobakStorageStack's OAC policy (ADR-027)
        # if: always() so this still runs even if an earlier stack in the
        # step above failed -- otherwise the OAC bucket policy's
        # same-account wildcard fallback would stay open for the rest of
        # this run too, not just resolve on the next successful one.
        if: always()
        working-directory: infra
        run: |
          # TtobakStorageStack's OAC bucket policy is a same-account
          # wildcard until it can resolve the real CloudFront distribution ID
          # (published by TtobakFrontendStack in the step above, via SSM).
          # Without a redeploy after Frontend, that wildcard would stay open
          # until whichever future push happens to redeploy Storage next.
          # Unlike the list above, this deploy is NOT a no-op even with zero
          # source changes: the distribution-ID lookup custom resource bumps
          # a Timestamp property on every synth specifically to force
          # CloudFormation to re-run it on every deploy (see storage-stack.ts)
          # -- that forced update is the whole mechanism this step relies on.
          npx cdk deploy TtobakStorageStack --exclusively --require-approval never
