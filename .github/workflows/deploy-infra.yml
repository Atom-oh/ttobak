name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', 'backend/cmd/**', 'backend/internal/**', 'backend/go.*', 'backend/python/qa/**', 'backend/python/crawler/**', 'backend/python/document-extract/**', 'mcp-server/**', 'scripts/operations/http_origin_release.py', '.github/workflows/deploy-infra.yml']
  workflow_dispatch:
    inputs:
      model_deployment_mode:
        description: 'Model preset: standard, terra or sonnet; blank inherits repository variable'
        required: false
        type: string
        default: ''
      model_meeting_summary:
        description: 'Final-note model ID; blank inherits repository variable or preset'
        required: false
        type: string
        default: ''
      model_translation:
        description: 'High-quality translation OpenAI model ID; blank inherits repository variable or Luna'
        required: false
        type: string
        default: ''
      model_retain_meeting_summary:
        description: 'Exact outgoing note model IDs to retain during cutover, comma-separated'
        required: false
        type: string
        default: ''
      model_retain_translation:
        description: 'Exact outgoing translation model IDs to retain during cutover, comma-separated'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Both the synth/test gate and release coordinator must consume the same choice.
# Repository variables persist on push; dispatch inputs override them for one run.
env:
  MODEL_DEPLOYMENT_MODE: ${{ inputs.model_deployment_mode || vars.MODEL_DEPLOYMENT_MODE }}
  MODEL_MEETING_SUMMARY: ${{ inputs.model_meeting_summary || vars.MODEL_MEETING_SUMMARY }}
  MODEL_TRANSLATION: ${{ inputs.model_translation || vars.MODEL_TRANSLATION }}
  MODEL_RETAIN_MEETING_SUMMARY: ${{ inputs.model_retain_meeting_summary || vars.MODEL_RETAIN_MEETING_SUMMARY }}
  MODEL_RETAIN_TRANSLATION: ${{ inputs.model_retain_translation || vars.MODEL_RETAIN_TRANSLATION }}

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  # Separate job (not a step) so failure gates EVERYTHING in deploy —
  # including its `if: always()` OAC re-tighten step, which as a sibling
  # step would still run after a failed in-job gate and deploy
  # TtobakStorageStack on a red test suite.
  infra-tests:
    runs-on: ttobak-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build HTTP MCP Lambda bundle
        # GatewayStack's ttobak-mcp function uses Code.fromAsset on this
        # gitignored output; cdk synth fails without it.
        working-directory: mcp-server
        run: |
          npm ci
          npm run bundle:lambda
      - name: Infra synth + unit tests (gate before any deploy)
        # Security invariants live in these jest assertions (e.g.
        # whisper-stack.test.ts's "no EntryPoint/Command on the whisperx
        # task definition" guard) — deploying without running them would
        # let a silently-bypassing CDK edit auto-ship on push-to-main.
        # `cdk synth` must gate here too: jest's per-stack synth uses dummy
        # envs and misses full-app synth errors, and the deploy job's
        # release coordinator is a separate execution step. Keep synthesis
        # and tests as prerequisites before every deployment mutation.
        working-directory: infra
        run: |
          npm ci
          npx cdk synth
          npm test

  deploy:
    runs-on: ttobak-arm
    needs: infra-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # Match backend/go.mod's `go 1.25.0` (see test-backend.yml). With
          # '1.24' the build fails with `go.mod requires go >= 1.25.0`.
          go-version: '1.25'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Restore and verify PDF font dependency
        run: |
          npm --prefix backend/internal/service/pdfassets ci --ignore-scripts --no-audit --no-fund
          npm --prefix backend/internal/service/pdfassets run verify
          npm --prefix backend/internal/service/pdfassets test

      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o /tmp/awscli.zip
          unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install --install-dir $HOME/.local/aws-cli --bin-dir $HOME/.local/bin --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Go Lambda binaries
        working-directory: backend
        run: |
          for dir in cmd/api cmd/transcribe cmd/summarize cmd/process-image cmd/kb cmd/research-worker cmd/websocket cmd/ws-authorizer; do
            GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o "$dir/bootstrap" "./$dir"
          done
          cp internal/service/pdfassets/node_modules/pretendard/dist/LICENSE.txt cmd/api/Pretendard-OFL.txt

      - name: Build HTTP MCP Lambda bundle
        # GatewayStack's ttobak-mcp function uses Code.fromAsset on this
        # gitignored output; cdk synth fails without it.
        working-directory: mcp-server
        run: |
          npm ci
          npm run bundle:lambda

      - name: Set up release Python
        id: release-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          architecture: 'arm64'

      - name: Prepare release SDK
        run: |
          "${{ steps.release-python.outputs.python-path }}" -m venv build/origin-release-venv
          build/origin-release-venv/bin/python -m pip install --disable-pip-version-check 'boto3<2'

      - name: CDK deploy with verified HTTP origin migration
        working-directory: infra
        run: |
          npm ci
          # The coordinator preserves the explicit per-stack --exclusively order,
          # excludes KnowledgeStack, verifies deployed reader readiness, and owns
          # same-proof bootstrap, pinned consumer/producer cutover and retirement.
          # CDK output is discarded because a diff can expose the old proof.
          ../build/origin-release-venv/bin/python ../scripts/operations/http_origin_release.py release \
            --receipt ../build/verification/http-origin-release.json

      - name: CDK deploy — re-tighten TtobakStorageStack's OAC policy (ADR-027)
        # if: always() so this still runs even if an earlier stack in the
        # step above failed -- otherwise the OAC bucket policy's
        # same-account wildcard fallback would stay open for the rest of
        # this run too, not just resolve on the next successful one.
        if: always()
        working-directory: infra
        run: |
          # TtobakStorageStack's OAC bucket policy is a same-account
          # wildcard until it can resolve the real CloudFront distribution ID
          # (published by TtobakFrontendStack in the step above, via SSM).
          # Without a redeploy after Frontend, that wildcard would stay open
          # until whichever future push happens to redeploy Storage next.
          # Unlike the list above, this deploy is NOT a no-op even with zero
          # source changes: the distribution-ID lookup custom resource bumps
          # a Timestamp property on every synth specifically to force
          # CloudFormation to re-run it on every deploy (see storage-stack.ts)
          # -- that forced update is the whole mechanism this step relies on.
          ../build/origin-release-venv/bin/python ../scripts/operations/http_origin_release.py retighten \
            --receipt ../build/verification/http-origin-retighten.json
