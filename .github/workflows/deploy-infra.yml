name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths: ['infra/**', 'backend/cmd/**', 'backend/internal/**', 'backend/go.*', 'backend/python/qa/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ttobak-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install AWS CLI
        run: |
          curl -s "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o /tmp/awscli.zip
          unzip -q /tmp/awscli.zip -d /tmp && /tmp/aws/install --install-dir $HOME/.local/aws-cli --bin-dir $HOME/.local/bin --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build Go Lambda binaries
        working-directory: backend
        run: |
          for dir in cmd/api cmd/transcribe cmd/summarize cmd/process-image cmd/kb cmd/research-worker; do
            GOOS=linux GOARCH=arm64 go build -tags lambda.norpc -o "$dir/bootstrap" "./$dir"
          done

      - name: Verify ttobak-agentcore-research-role exists
        run: |
          # TtobakAiStack imports this role by ARN to attach the Gateway-
          # invoke policy. It's a manually-created, pre-existing IAM
          # resource (not produced by any CI pipeline) -- fail fast with a
          # clear message instead of letting the CFN inline-policy-attach
          # step fail obscurely mid-deploy.
          aws iam get-role --role-name ttobak-agentcore-research-role >/dev/null

      - name: CDK deploy
        working-directory: infra
        run: |
          npm ci
          npx cdk diff 2>&1 || true
          # Never `--all` and never list stacks without `--exclusively`:
          # either one pulls in each named stack's full dependency closure,
          # which includes TtobakKnowledgeStack -- it stages a deliberate,
          # undeployed Bedrock KB teardown that would apply for real (see
          # CLAUDE.md Known Issues). Deploy every other stack individually
          # with --exclusively, in dependency order (see infra/bin/infra.ts
          # addDependency calls), so TtobakKnowledgeStack is never touched.
          npx cdk deploy TtobakWebSearchGatewayStack --exclusively --require-approval never
          npx cdk deploy TtobakStorageStack --exclusively --require-approval never
          npx cdk deploy TtobakAuthStack --exclusively --require-approval never
          npx cdk deploy TtobakAiStack --exclusively --require-approval never
          npx cdk deploy TtobakEdgeAuthStack --exclusively --require-approval never
          npx cdk deploy TtobakGatewayStack --exclusively --require-approval never
          npx cdk deploy TtobakCrawlerStack --exclusively --require-approval never
          npx cdk deploy TtobakResearchAgentStack --exclusively --require-approval never
          npx cdk deploy TtobakWhisperStack --exclusively --require-approval never
          npx cdk deploy TtobakFrontendStack --exclusively --require-approval never
